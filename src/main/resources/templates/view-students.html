
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registered Students | Student Portal</title>
    <link rel="stylesheet" th:href="@{/style.css}">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f5f9;
            color: #192957;
        }

        .container {
            display: flex;
            min-height: 100vh;
            width: 100%;
        }

        .sidebar {
            width: 250px;
            min-width: 250px;
            background: #192957;
            color: white;
            padding: 25px 20px;
        }

        .sidebar h2 {
            font-size: 28px;
            margin: 5px 0 45px;
        }

        .sidebar a {
            display: block;
            color: white;
            text-decoration: none;
            font-size: 18px;
            margin-bottom: 35px;
            line-height: 1.3;
        }

        .sidebar a:hover {
            color: #8db5ff;
        }

        .main-content {
            flex: 1;
            min-width: 0;
            padding: 40px;
        }

        .main-content h1 {
            font-size: 40px;
            margin: 0 0 10px;
        }

        .subtitle {
            color: #687b99;
            font-size: 20px;
            margin-bottom: 42px;
        }

        .search-container {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .search-container input {
            width: min(100%, 375px);
            padding: 15px;
            font-size: 18px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
        }

        .search-container button {
            background: #2861eb;
            color: white;
            border: none;
            padding: 15px 28px;
            border-radius: 9px;
            font-size: 18px;
            cursor: pointer;
        }

        .search-container button:hover {
            background: #194cc4;
        }

        .show-all {
            color: #2861eb;
            font-size: 18px;
            text-decoration: none;
            margin-left: 10px;
        }

        .table-card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.07);
            width: 100%;
            min-width: 0;
        }

        .table-container {
            width: 100%;
            max-width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            min-width: 850px;
            border-collapse: collapse;
        }

        th {
            background: #192957;
            color: white;
            padding: 20px 25px;
            text-align: left;
            font-size: 18px;
            white-space: nowrap;
        }

        td {
            padding: 25px;
            font-size: 17px;
            white-space: nowrap;
        }

        tbody tr:nth-child(even) {
            background: #f0f5ff;
        }

        tbody tr:hover {
            background: #e5edff;
        }

        .action-link {
            color: #2861eb;
            text-decoration: none;
            margin-right: 15px;
        }

        .delete-button {
            background: #dc3545;
            color: white;
            border: none;
            padding: 8px 13px;
            border-radius: 5px;
            cursor: pointer;
        }

        .delete-button:hover {
            background: #b02a37;
        }

        .error-message {
            color: #dc3545;
            margin-bottom: 15px;
        }

        .empty-message {
            text-align: center;
            padding: 30px;
            color: #687b99;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 150px;
                min-width: 150px;
                padding: 20px 12px;
            }

            .sidebar h2 {
                font-size: 21px;
            }

            .main-content {
                padding: 20px;
            }

            .main-content h1 {
                font-size: 28px;
            }

            .table-card {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- Sidebar -->
    <aside class="sidebar">
        <h2>Student Portal</h2>

        <a th:href="@{/}">Dashboard</a>
        <a th:href="@{/add-student}">Add Student</a>
        <a th:href="@{/view-students}">View Students</a>
        <a th:href="@{/attendance}">Attendance</a>
        <a th:href="@{/marks}">Marks</a>
        <a th:href="@{/settings}">Settings</a>
    </aside>

    <!-- Main Content -->
    <main class="main-content">

        <h1>Registered Students</h1>
        <p class="subtitle">
            Manage and search all registered students.
        </p>

        <!-- Search Form -->
        <form class="search-container"
              th:action="@{/search-students}"
              method="get">

            <input type="text"
                   name="keyword"
                   placeholder="Enter roll number or name"
                   th:value="${keyword}"
                   required>

            <button type="submit">Search</button>

            <a class="show-all"
               th:href="@{/view-students}">
                Show All Students
            </a>
        </form>

        <!-- Error Message -->
        <p class="error-message"
           th:if="${error}"
           th:text="${error}">
        </p>

        <!-- Student Table -->
        <div class="table-card">
            <div class="table-container">

                <table>
                    <thead>
                    <tr>
                        <th>Roll Number</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Department</th>
                        <th>Year</th>
                        <th>Actions</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="student : ${students}">
                        <td th:text="${student.rollNumber}"></td>
                        <td th:text="${student.name}"></td>
                        <td th:text="${student.email}"></td>
                        <td th:text="${student.department}"></td>
                        <td th:text="${student.year}"></td>

                        <td>
                            <a class="action-link"
                               th:href="@{/edit-student/{rollNumber}(rollNumber=${student.rollNumber})}">
                                Edit
                            </a>

                            <form th:action="@{/delete-student}"
                                  method="post"
                                  style="display:inline;">

                                <input type="hidden"
                                       name="rollNumber"
                                       th:value="${student.rollNumber}">

                                <button class="delete-button"
                                        type="submit"
                                        onclick="return confirm('Are you sure you want to delete this student?')">
                                    Delete
                                </button>
                            </form>
                        </td>
                    </tr>

                    <tr th:if="${students == null or #lists.isEmpty(students)}">
                        <td colspan="6" class="empty-message">
                            No students found.
                        </td>
                    </tr>

                    </tbody>
                </table>

            </div>
        </div>

    </main>
</div>

</body>
</html>
