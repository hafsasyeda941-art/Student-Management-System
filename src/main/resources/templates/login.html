
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f3f5f9;
            font-family: Arial, sans-serif;
        }

        .login-box {
            width: 380px;
            max-width: 90%;
            padding: 35px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            color: #192957;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 12px 0;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            background: #2861eb;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #194cc4;
        }

        .error {
            color: red;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h1>Admin Login</h1>

    <p class="error"
       th:if="${error}"
       th:text="${error}">
    </p>

    <form th:action="@{/login}" method="post">

        <input type="text"
               name="username"
               placeholder="Username"
               required>

        <input type="password"
               name="password"
               placeholder="Password"
               required>

        <button type="submit">Login</button>

    </form>

</div>

</body>
</html>
