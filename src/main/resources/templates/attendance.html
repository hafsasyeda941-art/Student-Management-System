
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Attendance Management</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f5f9;
            color: #192957;
        }

        .container {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 250px;
            min-width: 250px;
            background: #192957;
            color: white;
            padding: 25px 20px;
        }

        .sidebar h2 {
            font-size: 27px;
            margin-bottom: 45px;
        }

        .sidebar a {
            display: block;
            color: white;
            text-decoration: none;
            font-size: 18px;
            margin-bottom: 35px;
        }

        .main-content {
            flex: 1;
            min-width: 0;
            padding: 40px;
        }

        h1 {
            font-size: 36px;
            margin-top: 0;
        }

        .subtitle {
            color: #687b99;
            font-size: 19px;
            margin-bottom: 30px;
        }

        .success {
            color: green;
            margin-bottom: 20px;
        }

        .error {
            color: red;
            margin-bottom: 20px;
        }

        .table-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.07);
        }

        .table-container {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            min-width: 650px;
            border-collapse: collapse;
        }

        th {
            background: #192957;
            color: white;
            padding: 17px;
            text-align: left;
        }

        td {
            padding: 17px;
            border-bottom: 1px solid #eee;
        }

        input, select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            background: #2861eb;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #194cc4;
        }

        @media(max-width: 768px) {
            .sidebar {
                width: 150px;
                min-width: 150px;
                padding: 15px;
            }

            .main-content {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <aside class="sidebar">
        <h2>Student Portal</h2>

        <a th:href="@{/}">Dashboard</a>
        <a th:href="@{/add-student}">Add Student</a>
        <a th:href="@{/view-students}">View Students</a>
        <a th:href="@{/attendance}">Attendance</a>
        <a th:href="@{/marks}">Marks</a>
        <a th:href="@{/settings}">Settings</a>

        <form th:action="@{/logout}" method="post">
            <button type="submit">Logout</button>
        </form>
    </aside>

    <main class="main-content">

        <h1>Attendance Management</h1>

        <p class="subtitle">
            Mark and manage student attendance.
        </p>

        <p class="success"
           th:if="${param.success}">
            Attendance saved successfully!
        </p>

        <p class="error"
           th:if="${error}"
           th:text="${error}">
        </p>

        <div class="table-card">

            <div class="table-container">

                <table>

                    <thead>
                    <tr>
                        <th>Roll Number</th>
                        <th>Student Name</th>
                        <th>Date</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="student : ${students}">

                        <td th:text="${student.rollNumber}"></td>

                        <td th:text="${student.name}"></td>

                        <td>
                            <form th:action="@{/mark-attendance}"
                                  method="post">

                                <input type="hidden"
                                       name="rollNumber"
                                       th:value="${student.rollNumber}">

                                <input type="date"
                                       name="attendanceDate"
                                       required>

                        </td>

                        <td>
                            <select name="status" required>
                                <option value="Present">Present</option>
                                <option value="Absent">Absent</option>
                            </select>
                        </td>

                        <td>
                            <button type="submit">
                                Save
                            </button>

                            </form>
                        </td>

                    </tr>

                    <tr th:if="${#lists.isEmpty(students)}">
                        <td colspan="5">
                            No students registered yet.
                        </td>
                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </main>

</div>

</body>
</html>
