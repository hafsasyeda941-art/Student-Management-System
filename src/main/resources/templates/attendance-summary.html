
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Summary</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f5f9;
            color: #192957;
        }

        .container { display: flex; min-height: 100vh; }

        .sidebar {
            width: 230px;
            min-width: 230px;
            background: #192957;
            color: white;
            padding: 25px 20px;
        }

        .sidebar h2 { margin-bottom: 40px; }

        .sidebar a {
            display: block;
            color: white;
            text-decoration: none;
            margin-bottom: 28px;
        }

        .main-content {
            flex: 1;
            min-width: 0;
            padding: 35px;
        }

        .subtitle { color: #687b99; font-size: 18px; }

        .card {
            background: white;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,.07);
            margin-top: 25px;
        }

        .table-container { overflow-x: auto; }

        table {
            width: 100%;
            min-width: 650px;
            border-collapse: collapse;
        }

        th {
            background: #192957;
            color: white;
            padding: 17px;
            text-align: left;
        }

        td {
            padding: 18px;
            border-bottom: 1px solid #eee;
        }

        .percentage {
            font-weight: bold;
            color: #176b3a;
        }

        .error { color: red; }

        @media(max-width: 768px) {
            .sidebar {
                width: 145px;
                min-width: 145px;
                padding: 15px;
            }
            .main-content { padding: 20px; }
        }
    </style>
</head>

<body>
<div class="container">

    <aside class="sidebar">
        <h2>Student Portal</h2>
        <a th:href="@{/}">Dashboard</a>
        <a th:href="@{/add-student}">Add Student</a>
        <a th:href="@{/view-students}">View Students</a>
        <a th:href="@{/attendance}">Attendance</a>
        <a th:href="@{/attendance-history}">Attendance History</a>
        <a th:href="@{/attendance-summary}">Attendance Summary</a>
        <a th:href="@{/marks}">Marks</a>

        <form th:action="@{/logout}" method="post">
            <button type="submit">Logout</button>
        </form>
    </aside>

    <main class="main-content">

        <h1>Attendance Summary</h1>
        <p class="subtitle">
            View attendance percentages for all students.
        </p>

        <p class="error" th:if="${error}" th:text="${error}"></p>

        <div class="card">
            <div class="table-container">
                <table>
                    <thead>
                    <tr>
                        <th>Roll Number</th>
                        <th>Student Name</th>
                        <th>Total Days</th>
                        <th>Present Days</th>
                        <th>Attendance %</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="item : ${summaries}">
                        <td th:text="${item.rollNumber}"></td>
                        <td th:text="${item.studentName}"></td>
                        <td th:text="${item.totalDays}"></td>
                        <td th:text="${item.presentDays}"></td>
                        <td class="percentage"
                            th:text="${#numbers.formatDecimal(item.percentage, 1, 2) + '%'}">
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(summaries)}">
                        <td colspan="5">No students found.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>
</div>
</body>
</html>
